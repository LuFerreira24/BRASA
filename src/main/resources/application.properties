spring.application.name=brasa
server.port=${SERVER_PORT:8080}

# Banco de dados (valores padrao para rodar localmente; no Docker vem das variaveis de ambiente)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/brasa_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:brasa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:brasa}

# JPA / Hibernate
# O schema e criado pelo script BRASA_banco_de_dados.sql; o Hibernate apenas valida as entidades contra ele.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Actuator (usado no healthcheck do Docker)
management.endpoints.web.exposure.include=health,info
