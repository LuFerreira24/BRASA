services:
  app:
    build: .
    container_name: brasa_app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/brasa_db
      SPRING_DATASOURCE_USERNAME: brasa
      SPRING_DATASOURCE_PASSWORD: brasa
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: postgres:17-alpine
    container_name: brasa_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: brasa
      POSTGRES_PASSWORD: brasa
      POSTGRES_DB: brasa_db
    volumes:
      - brasa_pgdata:/var/lib/postgresql/data
      # Executado automaticamente apenas na primeira inicializacao (volume vazio)
      - ./BRASA_banco_de_dados.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brasa -d brasa_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  brasa_pgdata:
